<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UzRail Bot</title>
  <meta name="description" content="Set up the trips your UzRail Ticket Bot watches and books.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&icon_names=add,arrow_downward,arrow_forward,arrow_upward,bolt,check,check_circle,chevron_left,chevron_right,close,cloud_off,date_range,delete,desktop_access_disabled,download,edit,event_seat,expand_less,expand_more,history,lock,notifications,pause,pause_circle,person,person_add,play_arrow,progress_activity,radar,route,search,send,settings,speed,swap_horiz,swap_vert,timer,u_turn_left,visibility,visibility_off&display=block" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=16">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <button class="back" id="back" aria-label="Back" hidden><span class="ms" aria-hidden="true">chevron_left</span></button>
  <main id="app"></main>
  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <button data-tab="now"><span class="tab-icon"><span class="ms" aria-hidden="true">radar</span><i id="nowBadge" hidden></i></span><span>Now</span></button>
    <button data-tab="trips"><span class="tab-icon"><span class="ms" aria-hidden="true">route</span></span><span>Trips</span></button>
    <button data-tab="activity"><span class="tab-icon"><span class="ms" aria-hidden="true">history</span></span><span>Activity</span></button>
    <button data-tab="settings"><span class="tab-icon"><span class="ms" aria-hidden="true">settings</span></span><span>Settings</span></button>
  </nav>
  <div class="bottom-bar" id="bottomBar" hidden><button class="btn primary big" id="primaryBtn">Save</button></div>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js?v=16"></script>
</body>
</html>
